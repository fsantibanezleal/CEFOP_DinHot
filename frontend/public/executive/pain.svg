<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="The trap array grows uneven: some spots dim or missing, a ghost spot, and a scientist waiting at an uncorrected device">
<title>The trap array grows uneven: some spots dim or missing, a ghost spot, and a scientist waiting at an uncorrected device</title>
<style>
/* An animated scene (shell 0.14.0): the trap spots appear unevenly, one is missed, a ghost spot and a bright centre spot show, and the clock runs.
   The labels never move. A single 8 s loop. The static drawing below is the final frame and is what prefers-reduced-motion shows. */
.b1 { animation: b1 8s ease-out infinite; }
.b2 { animation: b2 8s ease-out infinite; }
.dim { animation: dim 8s ease-out infinite; }
.miss { animation: miss 8s ease-in-out infinite; }
.zero { animation: zero 8s ease-out infinite; }
.ghost { animation: ghost 8s ease-in-out infinite; }
.hand { animation: turn 8s linear infinite; transform-origin: 462px 404px; }
.wait { animation: wait 8s ease-in-out infinite; }
@keyframes b1 { 0%, 8% { opacity: 0; } 24%, 100% { opacity: 1; } }
@keyframes b2 { 0%, 22% { opacity: 0; } 40%, 100% { opacity: 1; } }
@keyframes dim { 0%, 38% { opacity: 0; } 54%, 100% { opacity: 1; } }
@keyframes miss { 0%, 52% { opacity: 0; } 64%, 100% { opacity: 1; } }
@keyframes zero { 0%, 60% { opacity: 0; } 72%, 100% { opacity: 1; } }
@keyframes ghost { 0%, 70% { opacity: 0; } 84%, 100% { opacity: 1; } }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes wait { 0%, 50% { opacity: 0; } 70%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .b1, .b2, .dim, .miss, .zero, .ghost, .hand, .wait { animation: none; opacity: 1; transform: none; }
}
</style>
