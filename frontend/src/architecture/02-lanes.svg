<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="The three lanes: offline, replay and live">
  <!-- Hand-authored; shell tokens only; both languages in one file (ADR-0058). -->
  <style>
    .arch-svg text { font-family: var(--font-sans); }
    .arch-svg .mono { font-family: var(--font-mono); }
    .arch-svg .pn { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1; }
    .arch-svg .on { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.2; }
    .arch-svg .ok { fill: var(--color-surface-2); stroke: var(--color-good); stroke-width: 1.2; }
    .arch-svg .wn { fill: var(--color-surface-2); stroke: var(--color-warn); stroke-width: 1.2; }
    .arch-svg .mg { fill: var(--color-surface-2); stroke: var(--color-magenta); stroke-width: 1.2; }
    .arch-svg .ln-off { fill: none; stroke: var(--color-magenta); stroke-width: 1.4; }
    .arch-svg .ln-rep { fill: none; stroke: var(--color-good); stroke-width: 1.4; }
    .arch-svg .ln-live { fill: none; stroke: var(--color-accent); stroke-width: 1.4; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 15px; font-weight: 700; }
    .arch-svg .h { fill: var(--color-fg); font-size: 12px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 11px; }
    .arch-svg .itb { fill: var(--color-fg); font-size: 11px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10.5px; }
    .arch-svg .cd { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .acc { fill: var(--color-accent); font-size: 11px; font-weight: 600; }
    .arch-svg .t-off { fill: var(--color-magenta); font-size: 12.5px; font-weight: 700; }
    .arch-svg .t-rep { fill: var(--color-good); font-size: 12.5px; font-weight: 700; }
    .arch-svg .t-live { fill: var(--color-accent); font-size: 12.5px; font-weight: 700; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; }
    .arch-svg .dash { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="dh2-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>
  <text class="ttl l-en" x="20" y="30">Three lanes: where each number is computed</text>
  <text class="ttl l-es" x="20" y="30">Tres carriles: dónde se calcula cada número</text>
  <rect class="ln-off" x="20" y="50" width="270" height="360" rx="10"/>
  <text class="t-off l-en" x="36" y="76">OFFLINE, on a workstation</text>
  <text class="t-off l-es" x="36" y="76">FUERA DE LÍNEA, en una estación</text>
  <rect class="bx" x="36" y="92" width="238" height="70" rx="6"/>
  <text class="it l-en" x="48" y="112">Bake and benchmark</text>
  <text class="it l-es" x="48" y="112">Precálculo y benchmark</text>
  <text class="cd mono" x="48" y="130">data-pipeline/run.py</text>
  <text class="sub l-en" x="48" y="148">named stages, seeded, deterministic</text>
  <text class="sub l-es" x="48" y="148">etapas con nombre, semilla, determinista</text>
  <rect class="bx" x="36" y="174" width="238" height="70" rx="6"/>
  <text class="it l-en" x="48" y="194">Lane gate, expected ranges</text>
  <text class="it l-es" x="48" y="194">Compuerta de carril, rangos</text>
  <text class="cd mono" x="48" y="212">core/gate.py · core/expect.py</text>
  <text class="sub l-en" x="48" y="230">a result outside its range fails</text>
  <text class="sub l-es" x="48" y="230">un resultado fuera de rango falla</text>
  <rect class="bx" x="36" y="256" width="238" height="70" rx="6"/>
  <text class="it l-en" x="48" y="276">Writes the artifacts</text>
  <text class="it l-es" x="48" y="276">Escribe los artefactos</text>
  <text class="cd mono" x="48" y="294">data/derived/</text>
  <text class="sub l-en" x="48" y="312">tests write only to a sandbox</text>
  <text class="sub l-es" x="48" y="312">las pruebas escriben sólo en un sandbox</text>
  <text class="sub l-en" x="36" y="352">Run on a data or model change;</text>
  <text class="sub l-es" x="36" y="352">Se corre al cambiar datos o modelo;</text>
  <text class="sub l-en" x="36" y="368">never in CI, never in the browser.</text>
  <text class="sub l-es" x="36" y="368">nunca en CI, nunca en el navegador.</text>
  <rect class="ln-rep" x="315" y="50" width="270" height="360" rx="10"/>
  <text class="t-rep l-en" x="331" y="76">REPLAY, committed</text>
  <text class="t-rep l-es" x="331" y="76">REPRODUCCIÓN, versionada</text>
  <rect class="bx" x="331" y="92" width="238" height="70" rx="6"/>
  <text class="it l-en" x="343" y="112">Index, manifests, traces</text>
  <text class="it l-es" x="343" y="112">Índice, manifiestos, trazas</text>
  <text class="cd mono" x="343" y="130">index/v1 · manifest/v1 · trace/v1</text>
  <text class="sub l-en" x="343" y="148">small, reviewable, in git</text>
  <text class="sub l-es" x="343" y="148">pequeños, revisables, en git</text>
  <rect class="bx" x="331" y="174" width="238" height="70" rx="6"/>
  <text class="it l-en" x="343" y="194">Copied into the site</text>
  <text class="it l-es" x="343" y="194">Copiados al sitio</text>
  <text class="cd mono" x="343" y="212">frontend/scripts/copy-data.mjs</text>
  <text class="sub l-en" x="343" y="230">exactly what the index declares</text>
  <text class="sub l-es" x="343" y="230">exactamente lo que declara el índice</text>
  <rect class="bx" x="331" y="256" width="238" height="70" rx="6"/>
  <text class="it l-en" x="343" y="276">Fetched as JSON</text>
  <text class="it l-es" x="343" y="276">Pedidos como JSON</text>
  <text class="cd mono" x="343" y="294">data/...json?v=VERSION</text>
  <text class="sub l-en" x="343" y="312">an HTML answer is an error</text>
  <text class="sub l-es" x="343" y="312">una respuesta HTML es un error</text>
  <text class="sub l-en" x="331" y="352">The web reads them; nothing</text>
  <text class="sub l-es" x="331" y="352">La web los lee; nada</text>
  <text class="sub l-en" x="331" y="368">baked is recomputed here.</text>
  <text class="sub l-es" x="331" y="368">precalculado se recalcula aquí.</text>
  <rect class="ln-live" x="610" y="50" width="270" height="360" rx="10"/>
  <text class="t-live l-en" x="626" y="76">LIVE, in the browser</text>
  <text class="t-live l-es" x="626" y="76">EN VIVO, en el navegador</text>
  <rect class="bx" x="626" y="92" width="238" height="70" rx="6"/>
  <text class="it l-en" x="638" y="112">Engine in a Web Worker</text>
  <text class="it l-es" x="638" y="112">Motor en un Web Worker</text>
  <text class="cd mono" x="638" y="130">frontend/src/engine/holo/</text>
  <text class="sub l-en" x="638" y="148">15 methods, cancel in one iteration</text>
  <text class="sub l-es" x="638" y="148">15 métodos, cancela en una iteración</text>
  <rect class="bx" x="626" y="174" width="238" height="70" rx="6"/>
  <text class="it l-en" x="638" y="194">WebGPU, optional</text>
  <text class="it l-es" x="638" y="194">WebGPU, opcional</text>
  <text class="cd mono" x="638" y="212">engine/holo/gpu/</text>
  <text class="sub l-en" x="638" y="230">agreement 2e-3, else the CPU path</text>
  <text class="sub l-es" x="638" y="230">concordancia 2e-3, si no la vía CPU</text>
  <rect class="bx" x="626" y="256" width="238" height="70" rx="6"/>
  <text class="it l-en" x="638" y="276">Held to the Python engine</text>
  <text class="it l-es" x="638" y="276">Sujeto al motor en Python</text>
  <text class="cd mono" x="638" y="294">*.parity.test.ts</text>
  <text class="sub l-en" x="638" y="312">reference values written by Python</text>
  <text class="sub l-es" x="638" y="312">valores de referencia escritos por Python</text>
  <text class="sub l-en" x="626" y="352">Run budget set by the lane gate:</text>
  <text class="sub l-es" x="626" y="352">Presupuesto fijado por la compuerta:</text>
  <text class="sub l-en" x="626" y="368">1500 ms, 256 KiB (see Benchmark).</text>
  <text class="sub l-es" x="626" y="368">1500 ms, 256 KiB (ver Benchmark).</text>
  <path class="flow" d="M274,291 H302 V127 H329" marker-end="url(#dh2-arrow)"/>
  <path class="flow" d="M569,127 H624" marker-end="url(#dh2-arrow)"/>
  <text class="sub l-en" x="20" y="432">artifacts flow left to right; the parity tests tie the right lane to the Python engine</text>
  <text class="sub l-es" x="20" y="432">los artefactos fluyen de izquierda a derecha; las pruebas de paridad atan el carril derecho al motor en Python</text>
</svg>
